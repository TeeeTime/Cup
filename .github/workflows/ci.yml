name: Quality Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  # -----------------------------------------------------------------
  # BACKEND: Java Compilation & Testing
  # -----------------------------------------------------------------
  backend:
    name: Java Backend (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Java Application
        run: mvn clean verify

  # -----------------------------------------------------------------
  # FRONTEND: Vue Compilation & ESLint
  # -----------------------------------------------------------------
  frontend:
    name: Vue Frontend (Lint, Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prism

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prism/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Vue Bundle
        run: npm run build